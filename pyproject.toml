[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visualpatchworld"
version = "0.1.0"
description = "VisualPatchWorld: structure-aware executable world-model induction for planner-usable code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Jiaxin Bai" },
  { name = "HKBU KnowComp" },
]
dependencies = [
  "numpy>=1.24",
  "openai>=1.0.0",
  "nltk>=3.8",
  "requests>=2.28",
]

[project.optional-dependencies]
# Heavy deps used by PatchWorld induction / optional LLM backends
llm = [
  "torch>=2.0",
  "transformers>=4.35",
]
# LeWM environments / MuJoCo planning (install separately as needed)
envs = [
  "stable-worldmodel[env]",
]

[project.urls]
Homepage = "https://github.com/HKBU-KnowComp/VisualPatchWorld"
Repository = "https://github.com/HKBU-KnowComp/VisualPatchWorld"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["patchworld*", "visualpatchworld*"]
